<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Área da Cozinha · Restaurante Express</title>
    <link rel="stylesheet" href="/public/styles.css" />
  </head>
  <body>
    <header class="topo">
      <div>
        <h1>Área da Cozinha</h1>
        <p>Acesso exclusivo para funcionários</p>
      </div>
      <div class="topo-acoes">
        <a class="pill pill-sec" href="/">Voltar ao cardápio</a>
      </div>
    </header>

    <main>
      <section id="login-card" class="card auth-card">
        <h3>Login de funcionário</h3>
        <form id="login-form">
          <label>Usuário <input id="func-user" required /></label>
          <label>Senha <input id="func-pass" type="password" required /></label>
          <button type="submit">Entrar</button>
        </form>
      </section>

      <section id="cozinha-app" class="tab" style="display: none">
        <h3>Painel de funcionários</h3>
        <p class="subtle">Visualize pedidos para fazer, pedidos concluídos e cadastre pratos.</p>
        <button id="logout-btn" class="sec-btn">Sair da área de funcionários</button>
        <div class="grid cols-funcionario" style="margin-top: 1rem">
          <section class="card">
            <h4>Pedidos para fazer</h4>
            <div id="pedidos-pendentes" class="coluna"></div>
          </section>
          <section class="card">
            <h4>Pedidos concluídos</h4>
            <div id="pedidos-concluidos" class="coluna"></div>
          </section>
        </div>

        <form id="prato-form" class="card" style="margin-top: 1rem">
          <h4>Cadastrar prato</h4>
          <label>Nome <input id="prato_nome" required /></label>
          <label>Categoria <input id="prato_categoria" required placeholder="Ex: Massas, Bebidas" /></label>
          <label>Preço (R$) <input id="prato_preco" type="number" min="0" step="0.01" required /></label>
          <label>Tempo estimado (min) <input id="prato_tempo" type="number" min="1" required /></label>
          <label>URL da imagem <input id="prato_imagem" type="url" placeholder="https://..." /></label>
          <button type="submit">Salvar prato</button>
        </form>
      </section>
    </main>

    <script src="/public/cozinha.js"></script>
  </body>
</html>
